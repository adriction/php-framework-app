# Nom de projet explicite : par defaut docker compose le derive du nom du
# dossier contenant ce fichier ("docker"), identique pour tout projet qui
# suit la meme convention (ex. l'ancien docker/ de php-framework) -> collision
# de noms de conteneurs/volumes/reseau entre projets voisins sans ceci.
name: php-framework-app

services:
  php:
    build:
      context: ./php
    volumes:
      - ../:/var/www/html
      # Le framework est une dependance Composer locale (repository "path" vers
      # ../php-framework, voir composer.json). Ce mount reproduit dans le
      # conteneur la meme relation de voisinage que sur l'hote, pour que
      # composer (execute dans ce conteneur) puisse resoudre "../php-framework"
      # et que le symlink vendor/adrien/php-framework fonctionne. En
      # lecture-ecriture : php-framework/Makefile delegue aussi son propre
      # `composer install`/`test` a ce conteneur (la librairie n'a pas de
      # runtime a elle, voir php-framework/CLAUDE.md).
      - ../../php-framework:/var/www/php-framework
    env_file:
      - ../.env
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8092}:80"
    depends_on:
      - php

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-php_framework_app}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-app}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${DB_EXPOSED_PORT:-3311}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
